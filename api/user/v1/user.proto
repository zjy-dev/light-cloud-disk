syntax = "proto3";

package api.user.v1;

option go_package = "github.com/J-Y-Zhang/light-cloud-disk/api/user/v1;v1";

service UserService {
  rpc Register (RegisterRequest) returns (RegisterReply);
  rpc Login (LoginRequest) returns (LoginReply);
  rpc GetUserInfo (GetUserInfoRequest) returns (GetUserInfoReply);
  rpc UpdateUserInfo (UpdateUserInfoRequest) returns (UpdateUserInfoReply);
  // 内部 RPC，供 file-service 调用
  rpc UpdateStorageUsed (UpdateStorageUsedRequest) returns (UpdateStorageUsedReply);
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string nickname = 3;
  string email = 4;
}

message RegisterReply {
  int64 user_id = 1;
  string username = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginReply {
  string token = 1;
  int64 expire_at = 2;
  UserInfo user = 3;
}

message GetUserInfoRequest {
  int64 user_id = 1;
}

message GetUserInfoReply {
  UserInfo user = 1;
}

message UpdateUserInfoRequest {
  int64 user_id = 1;
  string nickname = 2;
  string email = 3;
  string avatar = 4;
}

message UpdateUserInfoReply {
  bool success = 1;
}

message UpdateStorageUsedRequest {
  int64 user_id = 1;
  int64 delta = 2;
}

message UpdateStorageUsedReply {
  bool success = 1;
}

message UserInfo {
  int64 id = 1;
  string username = 2;
  string nickname = 3;
  string email = 4;
  string avatar = 5;
  int64 storage_used = 6;
  int64 storage_limit = 7;
  int64 created_at = 8;
}

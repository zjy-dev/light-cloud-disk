syntax = "proto3";

package api.file.v1;

option go_package = "github.com/J-Y-Zhang/light-cloud-disk/api/file/v1;v1";

service FileService {
  // Check instant upload and resumable upload
  rpc CheckUpload (CheckUploadRequest) returns (CheckUploadReply);
  // Upload file chunk
  rpc UploadChunk (UploadChunkRequest) returns (UploadChunkReply);
  // Merge file chunks
  rpc MergeChunks (MergeChunksRequest) returns (MergeChunksReply);
  // Get user file list
  rpc ListFiles (ListFilesRequest) returns (ListFilesReply);
  // Get file download URL
  rpc GetDownloadURL (GetDownloadURLRequest) returns (GetDownloadURLReply);
  // Delete files (move to trash)
  rpc DeleteFile (DeleteFileRequest) returns (DeleteFileReply);
  // Rename file
  rpc RenameFile (RenameFileRequest) returns (RenameFileReply);
  // Create folder
  rpc CreateFolder (CreateFolderRequest) returns (CreateFolderReply);
  // Move files or folders
  rpc MoveFile (MoveFileRequest) returns (MoveFileReply);
  // Get trash list
  rpc ListTrash (ListTrashRequest) returns (ListTrashReply);
  // Restore files from trash
  rpc RestoreFile (RestoreFileRequest) returns (RestoreFileReply);
  // Permanently delete files
  rpc PermanentDelete (PermanentDeleteRequest) returns (PermanentDeleteReply);
  // Create share link
  rpc CreateShare (CreateShareRequest) returns (CreateShareReply);
  // Get share content
  rpc GetShare (GetShareRequest) returns (GetShareReply);
  // Search files
  rpc SearchFiles (SearchFilesRequest) returns (SearchFilesReply);
  // Get disk usage
  rpc GetDiskUsage (GetDiskUsageRequest) returns (GetDiskUsageReply);
}

// Instant upload and resumable upload check
message CheckUploadRequest {
  string file_md5 = 1;
  int64 file_size = 2;
  int32 total_chunks = 3;
}

message CheckUploadReply {
  bool can_fast_upload = 1;
  repeated int32 uploaded_chunks = 2;
  bool disk_full = 3;
}

// Chunk upload
message UploadChunkRequest {
  string file_md5 = 1;
  int32 chunk_index = 2;
  int32 chunk_size = 3;
  bytes chunk_data = 4;
}

message UploadChunkReply {
  bool success = 1;
  int32 chunk_index = 2;
}

// Merge chunks
message MergeChunksRequest {
  int64 user_id = 1;
  int64 parent_id = 2;
  string file_name = 3;
  string file_md5 = 4;
  int64 file_size = 5;
  int32 total_chunks = 6;
}

message MergeChunksReply {
  bool success = 1;
  FileInfo file = 2;
}

// File list
message ListFilesRequest {
  int64 user_id = 1;
  int64 parent_id = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListFilesReply {
  repeated FileInfo files = 1;
  int64 total = 2;
}

// File info
message FileInfo {
  int64 id = 1;
  string name = 2;
  string file_md5 = 3;
  int64 size = 4;
  bool is_folder = 5;
  int64 parent_id = 6;
  string path = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

// Download
message GetDownloadURLRequest {
  int64 user_id = 1;
  int64 file_id = 2;
}

message GetDownloadURLReply {
  string download_url = 1;
  string file_name = 2;
}

// Delete files
message DeleteFileRequest {
  int64 user_id = 1;
  repeated int64 file_ids = 2;
}

message DeleteFileReply {
  bool success = 1;
}

// Rename
message RenameFileRequest {
  int64 user_id = 1;
  int64 file_id = 2;
  string new_name = 3;
}

message RenameFileReply {
  bool success = 1;
}

// Create folder
message CreateFolderRequest {
  int64 user_id = 1;
  int64 parent_id = 2;
  string name = 3;
}

message CreateFolderReply {
  bool success = 1;
  FileInfo folder = 2;
}

// Move files
message MoveFileRequest {
  int64 user_id = 1;
  repeated int64 file_ids = 2;
  int64 target_folder_id = 3;
}

message MoveFileReply {
  bool success = 1;
}

// Trash list
message ListTrashRequest {
  int64 user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListTrashReply {
  repeated TrashFileInfo files = 1;
  int64 total = 2;
}

message TrashFileInfo {
  int64 id = 1;
  string name = 2;
  int64 size = 3;
  bool is_folder = 4;
  int64 deleted_at = 5;
  int64 expire_at = 6;
}

// Restore files
message RestoreFileRequest {
  int64 user_id = 1;
  repeated int64 file_ids = 2;
}

message RestoreFileReply {
  bool success = 1;
}

// Permanent delete
message PermanentDeleteRequest {
  int64 user_id = 1;
  repeated int64 file_ids = 2;
}

message PermanentDeleteReply {
  bool success = 1;
}

// Share
message CreateShareRequest {
  int64 user_id = 1;
  int64 file_id = 2;
  int32 expire_days = 3;
  string password = 4;
}

message CreateShareReply {
  string share_id = 1;
  string share_url = 2;
  string password = 3;
  int64 expire_at = 4;
}

message GetShareRequest {
  string share_id = 1;
  string password = 2;
}

message GetShareReply {
  FileInfo file = 1;
  string download_url = 2;
}

// Search
message SearchFilesRequest {
  int64 user_id = 1;
  string keyword = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message SearchFilesReply {
  repeated FileInfo files = 1;
  int64 total = 2;
}

// Disk usage
message GetDiskUsageRequest {}

message GetDiskUsageReply {
  int64 local_used_bytes = 1;
  int64 local_max_bytes = 2;
  int64 seaweedfs_used_bytes = 3;
  int64 seaweedfs_max_bytes = 4;
}

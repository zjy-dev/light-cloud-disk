syntax = "proto3";

package api.file.v1;

option go_package = "github.com/J-Y-Zhang/light-cloud-disk/api/file/v1;v1";

import "google/api/annotations.proto";

service FileService {
  // 检查秒传和断点续传
  rpc CheckUpload (CheckUploadRequest) returns (CheckUploadReply) {
    option (google.api.http) = {
      get: "/api/v1/file/upload/check"
    };
  }
  
  // 上传文件分块
  rpc UploadChunk (UploadChunkRequest) returns (UploadChunkReply) {
    option (google.api.http) = {
      post: "/api/v1/file/upload/chunk"
      body: "*"
    };
  }
  
  // 合并文件分块
  rpc MergeChunks (MergeChunksRequest) returns (MergeChunksReply) {
    option (google.api.http) = {
      post: "/api/v1/file/upload/merge"
      body: "*"
    };
  }
  
  // 获取用户文件列表
  rpc ListFiles (ListFilesRequest) returns (ListFilesReply) {
    option (google.api.http) = {
      get: "/api/v1/files"
    };
  }
  
  // 获取文件下载链接
  rpc GetDownloadURL (GetDownloadURLRequest) returns (GetDownloadURLReply) {
    option (google.api.http) = {
      get: "/api/v1/file/download"
    };
  }
  
  // 删除文件（移到回收站）
  rpc DeleteFile (DeleteFileRequest) returns (DeleteFileReply) {
    option (google.api.http) = {
      delete: "/api/v1/file"
    };
  }
  
  // 重命名文件
  rpc RenameFile (RenameFileRequest) returns (RenameFileReply) {
    option (google.api.http) = {
      put: "/api/v1/file/rename"
      body: "*"
    };
  }
  
  // 创建文件夹
  rpc CreateFolder (CreateFolderRequest) returns (CreateFolderReply) {
    option (google.api.http) = {
      post: "/api/v1/folder"
      body: "*"
    };
  }
  
  // 移动文件/文件夹
  rpc MoveFile (MoveFileRequest) returns (MoveFileReply) {
    option (google.api.http) = {
      put: "/api/v1/file/move"
      body: "*"
    };
  }
  
  // 获取回收站列表
  rpc ListTrash (ListTrashRequest) returns (ListTrashReply) {
    option (google.api.http) = {
      get: "/api/v1/trash"
    };
  }
  
  // 恢复回收站文件
  rpc RestoreFile (RestoreFileRequest) returns (RestoreFileReply) {
    option (google.api.http) = {
      post: "/api/v1/trash/restore"
      body: "*"
    };
  }
  
  // 彻底删除文件
  rpc PermanentDelete (PermanentDeleteRequest) returns (PermanentDeleteReply) {
    option (google.api.http) = {
      delete: "/api/v1/trash"
    };
  }
  
  // 创建分享链接
  rpc CreateShare (CreateShareRequest) returns (CreateShareReply) {
    option (google.api.http) = {
      post: "/api/v1/share"
      body: "*"
    };
  }
  
  // 获取分享内容
  rpc GetShare (GetShareRequest) returns (GetShareReply) {
    option (google.api.http) = {
      get: "/api/v1/share/{share_id}"
    };
  }
  
  // 搜索文件
  rpc SearchFiles (SearchFilesRequest) returns (SearchFilesReply) {
    option (google.api.http) = {
      get: "/api/v1/files/search"
    };
  }
}

// 秒传/断点续传检查
message CheckUploadRequest {
  string file_md5 = 1;
  int64 file_size = 2;
  int32 total_chunks = 3;
}

message CheckUploadReply {
  bool can_fast_upload = 1;  // 是否可以秒传
  repeated int32 uploaded_chunks = 2;  // 已上传的分块索引
}

// 分块上传
message UploadChunkRequest {
  string file_md5 = 1;
  int32 chunk_index = 2;
  int32 chunk_size = 3;
  bytes chunk_data = 4;
}

message UploadChunkReply {
  bool success = 1;
  int32 chunk_index = 2;
}

// 合并分块
message MergeChunksRequest {
  int64 user_id = 1;
  int64 parent_id = 2;  // 父文件夹ID，0表示根目录
  string file_name = 3;
  string file_md5 = 4;
  int64 file_size = 5;
  int32 total_chunks = 6;
}

message MergeChunksReply {
  bool success = 1;
  FileInfo file = 2;
}

// 文件列表
message ListFilesRequest {
  int64 user_id = 1;
  int64 parent_id = 2;  // 父文件夹ID，0表示根目录
  int32 page = 3;
  int32 page_size = 4;
}

message ListFilesReply {
  repeated FileInfo files = 1;
  int64 total = 2;
}

// 文件信息
message FileInfo {
  int64 id = 1;
  string name = 2;
  string file_md5 = 3;
  int64 size = 4;
  bool is_folder = 5;
  int64 parent_id = 6;
  string path = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}

// 下载
message GetDownloadURLRequest {
  int64 user_id = 1;
  int64 file_id = 2;
}

message GetDownloadURLReply {
  string download_url = 1;
  string file_name = 2;
}

// 删除文件
message DeleteFileRequest {
  int64 user_id = 1;
  repeated int64 file_ids = 2;
}

message DeleteFileReply {
  bool success = 1;
}

// 重命名
message RenameFileRequest {
  int64 user_id = 1;
  int64 file_id = 2;
  string new_name = 3;
}

message RenameFileReply {
  bool success = 1;
}

// 创建文件夹
message CreateFolderRequest {
  int64 user_id = 1;
  int64 parent_id = 2;
  string name = 3;
}

message CreateFolderReply {
  bool success = 1;
  FileInfo folder = 2;
}

// 移动文件
message MoveFileRequest {
  int64 user_id = 1;
  repeated int64 file_ids = 2;
  int64 target_folder_id = 3;
}

message MoveFileReply {
  bool success = 1;
}

// 回收站列表
message ListTrashRequest {
  int64 user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListTrashReply {
  repeated TrashFileInfo files = 1;
  int64 total = 2;
}

message TrashFileInfo {
  int64 id = 1;
  string name = 2;
  int64 size = 3;
  bool is_folder = 4;
  int64 deleted_at = 5;
  int64 expire_at = 6;  // 过期时间（30天后自动删除）
}

// 恢复文件
message RestoreFileRequest {
  int64 user_id = 1;
  repeated int64 file_ids = 2;
}

message RestoreFileReply {
  bool success = 1;
}

// 彻底删除
message PermanentDeleteRequest {
  int64 user_id = 1;
  repeated int64 file_ids = 2;
}

message PermanentDeleteReply {
  bool success = 1;
}

// 分享
message CreateShareRequest {
  int64 user_id = 1;
  int64 file_id = 2;
  int32 expire_days = 3;  // 过期天数，0表示永久
  string password = 4;    // 提取码，空表示无密码
}

message CreateShareReply {
  string share_id = 1;
  string share_url = 2;
  string password = 3;
  int64 expire_at = 4;
}

message GetShareRequest {
  string share_id = 1;
  string password = 2;
}

message GetShareReply {
  FileInfo file = 1;
  string download_url = 2;
}

// 搜索
message SearchFilesRequest {
  int64 user_id = 1;
  string keyword = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message SearchFilesReply {
  repeated FileInfo files = 1;
  int64 total = 2;
}

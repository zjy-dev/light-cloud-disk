syntax = "proto3";

package api.user.v1;

option go_package = "github.com/J-Y-Zhang/light-cloud-disk/api/user/v1;v1";

import "google/api/annotations.proto";

service UserService {
  rpc Register (RegisterRequest) returns (RegisterReply) {
    option (google.api.http) = {
      post: "/api/v1/user/register"
      body: "*"
    };
  }
  
  rpc Login (LoginRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/api/v1/user/login"
      body: "*"
    };
  }
  
  rpc GetUserInfo (GetUserInfoRequest) returns (GetUserInfoReply) {
    option (google.api.http) = {
      get: "/api/v1/user/info"
    };
  }
  
  rpc UpdateUserInfo (UpdateUserInfoRequest) returns (UpdateUserInfoReply) {
    option (google.api.http) = {
      put: "/api/v1/user/info"
      body: "*"
    };
  }
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string nickname = 3;
  string email = 4;
}

message RegisterReply {
  int64 user_id = 1;
  string username = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginReply {
  string token = 1;
  int64 expire_at = 2;
  UserInfo user = 3;
}

message GetUserInfoRequest {
  int64 user_id = 1;
}

message GetUserInfoReply {
  UserInfo user = 1;
}

message UpdateUserInfoRequest {
  int64 user_id = 1;
  string nickname = 2;
  string email = 3;
  string avatar = 4;
}

message UpdateUserInfoReply {
  bool success = 1;
}

message UserInfo {
  int64 id = 1;
  string username = 2;
  string nickname = 3;
  string email = 4;
  string avatar = 5;
  int64 storage_used = 6;
  int64 storage_limit = 7;
  int64 created_at = 8;
}

server:
  grpc:
    addr: 0.0.0.0:9002
    timeout: 10s

data:
  database:
    driver: mysql
    max_idle_conns: 10
    max_open_conns: 100
    conn_max_lifetime: 3600s
  redis:
    read_timeout: 0.2s
    write_timeout: 0.2s
  kafka:
    brokers:
      - ${KAFKA_BROKERS:localhost:9092}
    thumbnail_topic: file-thumbnail
    cloud_migrate_topic: cloud-migrate

upload:
  chunk_size: 5242880  # 5MB
  temp_dir: ./tmp
  store_dir: ./store

storage:
  mode: ${STORAGE_MODE:local}             # "local" or "s3"
  primary_max_bytes: 10737418240          # 10 GB default
  threshold_percent: 80
  evict_target_percent: 90
  seaweedfs:
    endpoint: ${SEAWEEDFS_ENDPOINT:}
    region: us-east-1
    bucket: light-cloud-disk
    access_key: ${SEAWEEDFS_ACCESS_KEY:}
    secret_key: ${SEAWEEDFS_SECRET_KEY:}
  oss:
    endpoint: ${OSS_ENDPOINT:}
    bucket: ${OSS_BUCKET:light-cloud-disk}
    access_key_id: ${OSS_ACCESS_KEY_ID:}
    access_key_secret: ${OSS_ACCESS_KEY_SECRET:}
    region: ${OSS_REGION:cn-hangzhou}

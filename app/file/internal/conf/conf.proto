syntax = "proto3";
package kratos.api;

option go_package = "github.com/J-Y-Zhang/light-cloud-disk/app/file/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Upload upload = 3;
  Storage storage = 4;
}

message Server {
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  GRPC grpc = 1;
}

message Data {
  message Database {
    string driver = 1; // "mysql" or "sqlite"
    int32 max_idle_conns = 2;
    int32 max_open_conns = 3;
    google.protobuf.Duration conn_max_lifetime = 4;
  }
  message Redis {
    google.protobuf.Duration read_timeout = 1;
    google.protobuf.Duration write_timeout = 2;
  }
  message Kafka {
    repeated string brokers = 1;
    string transfer_topic = 2;
    string thumbnail_topic = 3;
    string cloud_migrate_topic = 4;
  }
  Database database = 1;
  Redis redis = 2;
  Kafka kafka = 3;
}

message Upload {
  int64 chunk_size = 1;
  string temp_dir = 2;
  string store_dir = 3;
}

message Storage {
  // "local" = local disk primary, "s3" = SeaweedFS (S3) primary
  string mode = 1;

  // Primary storage capacity limit (local disk in local mode, SeaweedFS in s3 mode)
  int64 primary_max_bytes = 2;

  // LRU eviction triggers when primary usage exceeds this percentage
  int32 threshold_percent = 3; // default 80

  // After eviction, reduce usage down to this percentage of threshold (default 90)
  int32 evict_target_percent = 4; // default 90

  message SeaweedFS {
    string endpoint = 1;
    string region = 2;
    string bucket = 3;
    string access_key = 4;
    string secret_key = 5;
  }

  message OSS {
    string endpoint = 1;
    string bucket = 2;
    string access_key_id = 3;
    string access_key_secret = 4;
    string region = 5;
  }

  SeaweedFS seaweedfs = 5;
  OSS oss = 6;
}

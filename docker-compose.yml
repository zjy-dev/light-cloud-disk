# Podman/Docker Compose configuration
#
# Usage: podman-compose --env-file .env up -d
#
# Single-mode: local disk + Redis + Consul + MySQL (or SQLite via DB_DRIVER)

services:
  consul:
    image: docker.io/hashicorp/consul:1.19
    container_name: cloud-disk-consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    environment:
      NO_PROXY: "*"
      no_proxy: "*"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
    volumes:
      - consul_data:/consul/data
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloud-disk

  mysql:
    image: docker.io/library/mysql:8.0
    container_name: cloud-disk-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-cloud_disk}
      TZ: Asia/Shanghai
      NO_PROXY: "*"
      no_proxy: "*"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloud-disk

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: cloud-disk-redis
    environment:
      NO_PROXY: "*"
      no_proxy: "*"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloud-disk

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: user
        VERSION: ${VERSION:-dev}
    image: light-cloud-disk/user-service:${VERSION:-latest}
    container_name: cloud-disk-user
    environment:
      DB_DRIVER: ${DB_DRIVER:-mysql}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root123}
      DB_NAME: ${DB_NAME:-cloud_disk}
      SQLITE_PATH: ${SQLITE_PATH:-/app/data/user.db}
      CONSUL_ADDR: consul:8500
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret}
      NO_PROXY: "*"
      no_proxy: "*"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
    ports:
      - "9001:9001"
    volumes:
      - user_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - cloud-disk

  file-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: file
        VERSION: ${VERSION:-dev}
    image: light-cloud-disk/file-service:${VERSION:-latest}
    container_name: cloud-disk-file
    environment:
      DB_DRIVER: ${DB_DRIVER:-mysql}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root123}
      DB_NAME: ${DB_NAME:-cloud_disk}
      SQLITE_PATH: ${SQLITE_PATH:-/app/data/file.db}
      REDIS_ADDR: redis:6379
      CONSUL_ADDR: consul:8500
      PRIMARY_MAX_BYTES: ${PRIMARY_MAX_BYTES:-53687091200}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_REGION: ${OSS_REGION:-cn-hangzhou}
      OSS_BUCKET: ${OSS_BUCKET:-light-cloud-disk}
      ERASURE_DATA_SHARDS: ${ERASURE_DATA_SHARDS:-4}
      ERASURE_PARITY_SHARDS: ${ERASURE_PARITY_SHARDS:-2}
      ERASURE_MIN_FILE_SIZE: ${ERASURE_MIN_FILE_SIZE:-1048576}
      FILE_TMP_DIR: /app/tmp
      FILE_STORE_DIR: /app/store
      NO_PROXY: "*"
      no_proxy: "*"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
    ports:
      - "9002:9002"
    volumes:
      - file_tmp:/app/tmp
      - file_store:/app/store
      - file_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - cloud-disk

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
        VERSION: ${VERSION:-dev}
    image: light-cloud-disk/gateway:${VERSION:-latest}
    container_name: cloud-disk-gateway
    environment:
      CONSUL_ADDR: consul:8500
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret}
      GATEWAY_ADDR: ":8080"
      NO_PROXY: "*"
      no_proxy: "*"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
    ports:
      - "8080:8080"
    depends_on:
      consul:
        condition: service_healthy
      user-service:
        condition: service_started
      file-service:
        condition: service_started
    networks:
      - cloud-disk

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: light-cloud-disk/frontend:${VERSION:-latest}
    container_name: cloud-disk-frontend
    environment:
      NO_PROXY: "*"
      no_proxy: "*"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - cloud-disk

volumes:
  consul_data:
  mysql_data:
  redis_data:
  file_tmp:
  file_store:
  file_data:
  user_data:

networks:
  cloud-disk:
    driver: bridge
